    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: WALLET_URL
        value: https://cred-demo-wallet.onrender.com
      - key: BENEFITS_URL
        value: https://cred-demo-benefits.onrender.com

  - type: web
    name: cred-demo-benefits
