services:
  - type: web
    name: cred-demo-wallet
    runtime: python
    plan: free
    branch: main
    rootDir: apps/wallet
    buildFilter:
      paths:
        - apps/wallet/**
    autoDeployTrigger: checksPass
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: PAYROLL_URL
        value: https://cred-demo-payroll.onrender.com
      - key: BENEFITS_URL
        value: https://cred-demo-benefits.onrender.com

  - type: web
    name: cred-demo-payroll
    runtime: python
    plan: free
    branch: main
    rootDir: apps/payroll
