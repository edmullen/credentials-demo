    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: WALLET_URL
        value: https://cred-demo-wallet.onrender.com
      - key: PAYROLL_URL
        value: https://cred-demo-payroll.onrender.com
