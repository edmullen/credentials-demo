# Sample people for the credentials demo (#6).
#
# Hand-written and curated, not random: most people exist to make a specific rule visible,
# recorded in `demonstrates`. The generator derives everything mechanical from this file —
# subject identifiers, paystub figures, and the expected-outcomes table in docs/sample-data.md.
#
# Everyone is fictional. Street addresses are invented; towns, counties and ZIP codes are real
# so the eligibility rules have real inputs. Photos are AI-generated faces of people who don't
# exist, made to the `photo_brief` (docs/decisions.md).
#
# Field notes:
#   identity   verified | tampered | none (docs/credential-model.md §0, #6)
#   address    where the person actually lives. For the residency-fake tamper, the altered
#              address the credential falsely claims is under `tamper.claimed_address`.
#   jobs.pay   hourly: rate in dollars and `hours` per semi-monthly pay period, the same in both
#              September periods. salary: annual amount, paid in 24 equal installments.
#
# Reference points (docs/benefit-programs.md), monthly gross:
#   Health free <= 1,835.40 · full price >= 6,650.00 · Food <= 2,460.50 · Energy <= 2,500.00
#   Dividend bump reaches zero at 1,200.00 · Housing: 30% of county AMI / 12, varies by county

