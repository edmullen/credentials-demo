# Sample employers for the credentials demo (#6).
#
# All fictional. Each is a recognizable *type* of New Jersey employer, but the names are
# invented and any resemblance to a real company is unintended: the demo attaches invented
# wages to these names, which would misrepresent a real employer's pay (docs/decisions.md).
#
# Every employer uses Meridian Payroll, the demo's one payroll provider.

employers:
