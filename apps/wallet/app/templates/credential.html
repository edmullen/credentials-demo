{% extends "base.html" %}
{% set page_title = person.name ~ " — Identity credential" %}
{% block main %}
    <div class="wrap stack">
      <a class="back" href="/p/{{ person.id }}/credentials">All credentials</a>
      <div class="stack-s">
        <p class="intro__eyebrow">Identity credential</p>
        <h1 class="intro__title">{{ person.name }}</h1>
      </div>
      <section class="panel" aria-labelledby="status">
        {%- set heading_tag = "h2" -%}
        {%- set id_prefix = "" -%}
        {% include "_credential_panel.html" %}
      </section>
    </div>
{% endblock %}
