[project]
name = "wallet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pyjwt[crypto]>=2.9",
    # <49: later versions publish no Intel-Mac wheel (source build needs OpenSSL + pkg-config).
    "cryptography<49",
    "uvicorn[standard]>=0.32",
    # Outbound calls to Payroll (docs/design.md §3), not just fastapi.testclient.TestClient.
    "httpx>=0.27",
    # zoneinfo needs a time zone database; this guarantees one regardless of the runtime's own.
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
