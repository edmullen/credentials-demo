<!DOCTYPE html>
<html lang="en" data-app="{{ site.theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block page_title %}{{ site.title }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="{{ site.fonts_url }}" rel="stylesheet">
  <link rel="stylesheet" href="/static/cred.css">
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>
  <header class="header">
    <div class="header__inner">
      <a class="header__brand" href="/">
        <span class="header__mark" aria-hidden="true"></span>
        {{ site.name }}
      </a>
      <nav class="header__nav" aria-label="Main">
        {% for program in programs %}
        <a href="/programs/{{ program.code }}"{% if active == program.code %} aria-current="page"{% endif %}>{{ program.name }}</a>
        {% endfor %}
      </nav>
      <a class="header__admin" href="/admin"{% if active == "admin" %} aria-current="page"{% endif %}>Admin</a>
      <details class="nav-menu">
        <summary>Menu</summary>
        <div class="nav-menu__panel">
          {% for program in programs %}
          <a href="/programs/{{ program.code }}"{% if active == program.code %} aria-current="page"{% endif %}>{{ program.name }}</a>
          {% endfor %}
          <a class="nav-menu__admin" href="/admin"{% if active == "admin" %} aria-current="page"{% endif %}>Admin (demo)</a>
        </div>
      </details>
    </div>
  </header>

  <main class="main{% block main_class %}{% endblock %}" id="main">
    {% block main %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="wrap">
      <span><strong>This is a demo.</strong> For more info, <a href="https://github.com/edmullen/credentials-demo">view this repo.</a></span>
    </div>
  </footer>
</body>
</html>
